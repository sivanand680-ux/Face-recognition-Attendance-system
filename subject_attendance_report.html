<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Attendance Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7fb;
            font-family: "Segoe UI", sans-serif;
        }
        .page-box {
            max-width: 1100px;
            margin: 30px auto;
        }
        .card-box {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
        }
    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/professional-ui.css') }}?v=wild2">
</head>
<body>

<div class="container page-box">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">Subject Attendance Report</h3>
        <a href="/dashboard" class="btn btn-outline-dark">Back to Dashboard</a>
    </div>

    <div class="card card-box p-4">
        <h5 class="mb-3">Subject-wise Marked Attendance</h5>

        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Subject</th>
                        <th>Course</th>
                        <th>Batch</th>
                        <th>Total Attendance Marked</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in report_rows %}
                    <tr>
                        <td>{{ row.subject_name }}</td>
                        <td>{{ row.course }}</td>
                        <td>{{ row.batch }}</td>
                        <td>{{ row.total_marked }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center text-muted">No report data found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>


<script src="{{ url_for('static', filename='js/professional-ui.js') }}?v=wild2"></script>
</body>
</html>
