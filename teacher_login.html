<!DOCTYPE html>
<html>
<head>
    <title>Teacher Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/professional-ui.css') }}?v=wild2">
</head>
<body class="professional-login">

<div class="card p-4 shadow" style="width:380px;">
    <h4 class="text-center mb-3">
        <i class="bi bi-person-workspace"></i> Teacher Login
    </h4>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="teacher_id" class="form-control mb-2"
               placeholder="Teacher ID" required>

        <input type="password" name="password" class="form-control mb-3"
               placeholder="Password" required>

        <button class="btn btn-success w-100">
            <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
        <a href="/teacher_register" class="btn btn-outline-secondary w-100 mt-3">New teacher registration</a>
        <a href="/login_portal" class="btn btn-link w-100 mt-2">Back to Portal</a>
    </form>
</div>


<script src="{{ url_for('static', filename='js/professional-ui.js') }}?v=wild2"></script>
</body>
</html>
