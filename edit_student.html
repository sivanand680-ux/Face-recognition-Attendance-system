<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7fb;
            font-family: "Segoe UI", sans-serif;
        }
        .page-box {
            max-width: 900px;
            margin: 30px auto;
        }
        .card-box {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
        }
    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/professional-ui.css') }}?v=wild2">
</head>
<body>

<div class="container page-box">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">Edit Student</h3>
        <a href="/manage_students" class="btn btn-outline-dark">Back</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="card card-box p-4">
        <form method="POST" class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Roll Number</label>
                <input type="text" name="roll_no" class="form-control" value="{{ student.roll_no }}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Student Name</label>
                <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ student.email or '' }}">
            </div>

            <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ student.phone or '' }}">
            </div>

            <div class="col-md-6">
                <label class="form-label">Course</label>
                <select name="course" class="form-select" required>
                    <option value="">Select Course</option>
                    {% for c in courses %}
                    <option value="{{ c.course_name }}" {% if student.course == c.course_name %}selected{% endif %}>
                        {{ c.course_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Batch</label>
                <select name="batch" class="form-select" required>
                    <option value="">Select Batch</option>
                    {% for b in batches %}
                    <option value="{{ b.batch_name }}" {% if student.batch == b.batch_name %}selected{% endif %}>
                        {{ b.batch_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control" rows="3">{{ student.address or '' }}</textarea>
            </div>

            <div class="col-12">
                <button class="btn btn-success">Update Student</button>
            </div>
        </form>
    </div>
</div>


<script src="{{ url_for('static', filename='js/professional-ui.js') }}?v=wild2"></script>
</body>
</html>
